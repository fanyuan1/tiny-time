<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52abf1"/>
      <stop offset="1" stop-color="#3f9de9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd558"/>
      <stop offset="1" stop-color="#fcc445"/>
    </linearGradient>
  </defs>
  <rect id="tile" width="512" height="512" rx="120" fill="url(#bg)"/>
  <g id="clock">
    <circle cx="256" cy="256" r="210" fill="url(#ring)"/>
    <circle cx="256" cy="256" r="169" fill="#fbf9f3"/>
    <g stroke-width="33" stroke-linecap="round">
      <line x1="256" y1="256" x2="168" y2="186" stroke="#4b88e1"/>
      <line x1="256" y1="256" x2="350" y2="158" stroke="#f37957"/>
    </g>
    <circle cx="256" cy="256" r="27" fill="#fdb638"/>
  </g>
</svg>
